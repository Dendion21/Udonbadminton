<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UdonThani Badminton Club</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #1976d2;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    nav {
      background-color: #1565c0;
      padding: 0.5rem;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    .content {
      padding: 2rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    table, th, td {
      border: 1px solid #ddd;
    }
    th, td {
      padding: 0.75rem;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <header>
    <h1>UdonThani Badminton Club</h1>
    <p>Welcome to our official website!</p>
  </header>
  <nav>
    <a href="#">Home</a>
    <a href="#">Rankings</a>
    <a href="#">Schedule</a>
    <a href="#">Hall of Fame</a>
  </nav>
  <div class="content">
    <h2>Top Player Rankings</h2>
    <table>
      <tr>
        <th>Rank</th>
        <th>Name</th>
        <th>Wins</th>
        <th>Losses</th>
      </tr>
      <tr>
        <td>1</td>
        <td>Player A</td>
        <td>10</td>
        <td>2</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Player B</td>
        <td>8</td>
        <td>4</td>
      </tr>
    </table>
  </div>
</body>
</html>
